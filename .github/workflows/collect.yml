name: collect

on:
  schedule:
    # 한국 시간 09:37, 15:37, 21:37
    # 정각은 GitHub 예약 실행이 몰려 늦어지거나 빠지는 일이 잦아서 피한다.
    # 이 PC 실행(:10)이 끝난 뒤에 돌도록 30분 넘게 띄운다.
    - cron: '37 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect and post
        id: run
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_JOBS: ${{ secrets.DISCORD_WEBHOOK_JOBS }}
          DISCORD_WEBHOOK_EVENTS: ${{ secrets.DISCORD_WEBHOOK_EVENTS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_FORUM: ${{ vars.DISCORD_FORUM }}
        run: node src/run.js --runner cloud
      # 게시한 기록을 잃으면 다음 실행 때 같은 공고를 다시 올리므로,
      # 이 PC가 그 사이에 올린 커밋과 부딪혀도 몇 번 다시 시도한다.
      - name: Save state
        run: |
          git config user.name "career-feed-bot"
          git config user.email "career-feed-bot@users.noreply.github.com"
          git add data/items-cloud.json
          git diff --cached --quiet || git commit -m "chore: update collected items"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
      # 소스 하나라도 실패했으면 상태를 저장한 뒤 실행을 실패로 표시해 알림이 가게 한다.
      - name: Report source failures
        if: steps.run.outcome == 'failure'
        run: exit 1

  # 수집이 일부 실패해도 저장된 기록으로 캘린더는 갱신한다.
  calendar:
    needs: collect
    if: always()
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
