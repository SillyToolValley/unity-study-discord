name: collect

on:
  # 평소에는 운영자 PC가 09:10, 15:10, 21:10 수집을 마친 뒤 이 워크플로를 직접 실행한다(workflow_dispatch).
  # GitHub 예약 실행은 몇 시간씩 늦거나 빠지는 일이 잦아서, PC가 꺼져 있을 때를 위한 대비로만 둔다.
  # 예약 실행은 최근 5시간 안에 PC가 실행시킨 수집이 있으면 건너뛴다(gate 작업).
  schedule:
    - cron: '37 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          since=$(date -u -d '-5 hours' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/collect.yml/runs" \
                -f event=workflow_dispatch -f created=">=$since" --jq '.total_count')
          echo "workflow_dispatch runs since $since: $n"
          if [ "${n:-0}" -gt 0 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  collect:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect and post
        id: run
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_JOBS: ${{ secrets.DISCORD_WEBHOOK_JOBS }}
          DISCORD_WEBHOOK_EVENTS: ${{ secrets.DISCORD_WEBHOOK_EVENTS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_FORUM: ${{ vars.DISCORD_FORUM }}
        run: node src/run.js --runner cloud
      # 게시한 기록을 잃으면 다음 실행 때 같은 공고를 다시 올리므로,
      # 이 PC가 그 사이에 올린 커밋과 부딪혀도 몇 번 다시 시도한다.
      - name: Save state
        run: |
          git config user.name "career-feed-bot"
          git config user.email "career-feed-bot@users.noreply.github.com"
          git add data/items-cloud.json
          git diff --cached --quiet || git commit -m "chore: update collected items"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
      # 소스 하나라도 실패했으면 상태를 저장한 뒤 실행을 실패로 표시해 알림이 가게 한다.
      - name: Report source failures
        if: steps.run.outcome == 'failure'
        run: exit 1

  # 수집이 일부 실패해도 저장된 기록으로 캘린더는 갱신한다.
  calendar:
    needs: [gate, collect]
    if: always() && needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
